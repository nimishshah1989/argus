services:
  server:
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: '3001'
    expose:
      - '3001'
    networks: [web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ../apps/web/dist:/srv/web:ro
    networks: [web]

networks:
  web: {}

volumes:
  caddy_data: {}
  caddy_config: {}
