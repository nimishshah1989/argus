services:
  server:
    image: ${ECR_REGISTRY}/uptimo-server:${IMAGE_TAG}
    restart: unless-stopped
    env_file: app.env
    environment:
      PORT: '3001'
      NODE_ENV: production
    # Uploaded company logos (FILES_DIR, set in app.env by refresh-env.sh). A named volume outlives the container,
    # so a redeploy keeps them; nothing in deploy.sh removes volumes. Backed up nightly (files-backup.sh).
    volumes:
      - files:/data/files
    expose:
      - '3001'
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${LOG_GROUP}
        tag: '{{.Name}}'
    networks: [web]

  caddy:
    image: ${ECR_REGISTRY}/uptimo-web:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

networks:
  web: {}

volumes:
  files:
    name: uptimo_files
  caddy_data: {}
  caddy_config: {}
