<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The status bar takes the page colour (neutral-100 in tokens.css), light and dark. -->
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <!-- Two apps from one site: the address you install from decides which one (floor or desk). -->
    <script>
      document.head.insertAdjacentHTML(
        'beforeend',
        '<link rel="manifest" href="/manifest-' +
          (location.pathname.indexOf('/desk') === 0 ? 'desk' : 'floor') +
          '.webmanifest" />',
      );
    </script>
    <title>Uptimo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
