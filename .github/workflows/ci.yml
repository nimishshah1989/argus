name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

# Runs once per ready PR, not per draft push and not again on main: builders run pnpm precheck and the suites
# locally, deploy.yml has its own health and PDF checks with rollback, and a clash between two merged PRs
# shows on the next PR's run. Draft PRs run nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Cheap fan-out gate: which suites can this PR possibly exercise? Fails OPEN — when origin/main or the
    # merge-base is unavailable (shallow clone, no remote), every area is true, because a missing run is worse
    # than an extra run. The decision lives in tools/changed-areas.sh so it can be run locally.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      server: ${{ steps.areas.outputs.server }}
      web: ${{ steps.areas.outputs.web }}
      gallery: ${{ steps.areas.outputs.gallery }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: areas
        run: |
          fail_open() {
            printf 'server=true\nweb=true\ngallery=true\n' >> "$GITHUB_OUTPUT"
            echo "::warning::changed-areas: $1; running every suite"
          }
          if ! git fetch --no-tags origin main; then
            fail_open "origin/main unavailable"
            exit 0
          fi
          if ! paths=$(git diff --name-only origin/main...HEAD); then
            fail_open "no merge-base with origin/main"
            exit 0
          fi
          if [ -z "$paths" ]; then
            fail_open "empty diff"
            exit 0
          fi
          if ! areas=$(bash tools/changed-areas.sh $paths); then
            fail_open "changed-areas.sh failed"
            exit 0
          fi
          printf '%s\n' "$areas" | tr ' ' '\n' >> "$GITHUB_OUTPUT"

  static:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm parity
      - run: pnpm docs:check
      - run: pnpm pii:scan
      - run: pnpm licences
      - run: pnpm migrations:check
      - run: pnpm ui:check
      - run: pnpm audit:deps
      - run: pnpm audit:lean
      - run: pnpm changelog:check
        if: github.event_name == 'pull_request'
        env:
          # A merge train carries one fragment per ticket; the rule is train-aware and reads this.
          PR_BODY: ${{ github.event.pull_request.body }}
      - run: pnpm migrations:immutable
        if: github.event_name == 'pull_request'

  api:
    needs: changes
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.server == 'true' }}
    name: api (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        # Prose-only PRs (plans, designs, decisions, wiki, changelog, agent skills) skip the install and the
        # tests; the job still reports, so required checks stay green.
        run: |
          run=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Evq '^(docs/|wiki/|changes/|\.claude/|[^/]+\.md$)'; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.run == 'true'
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        if: steps.paths.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.paths.outputs.run == 'true'
      - name: Install Chromium
        if: steps.paths.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/3
        if: steps.paths.outputs.run == 'true'

  browser:
    needs: changes
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.web == 'true' }}
    name: browser (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        # Prose-only PRs (plans, designs, decisions, wiki, changelog, agent skills) skip the install and the
        # tests; the job still reports, so required checks stay green.
        run: |
          run=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Evq '^(docs/|wiki/|changes/|\.claude/|[^/]+\.md$)'; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.run == 'true'
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        if: steps.paths.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.paths.outputs.run == 'true'
      - name: Install Chromium
        if: steps.paths.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/3
        if: steps.paths.outputs.run == 'true'

  gallery:
    needs: changes
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.gallery == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    # 15, not 8: the gallery runs every v2 screen's specs in one job (about 7 minutes at 223 tests, and each screen
    # adds more), and a run cancelled at the limit hides real failures.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: paths
        run: |
          run=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            run=false
            if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(apps/web/|playwright\.gallery\.config\.ts$|tools/check-ui\.ts$|tools/gallery-baselines\.sh$|package\.json$|package-lock\.json$|pnpm-lock\.yaml$|tsconfig[^/]*\.json$|[^/]+\.config\.ts$)'; then run=true; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - run: apt-get update && apt-get install -y fonts-noto-core
        if: steps.paths.outputs.run == 'true'
      - run: npm i -g pnpm@10.30.3 && pnpm install --frozen-lockfile
        if: steps.paths.outputs.run == 'true'
      - run: pnpm gallery:test
        if: steps.paths.outputs.run == 'true'
      - uses: actions/upload-artifact@v4
        if: failure() && steps.paths.outputs.run == 'true'
        with:
          name: gallery-diffs
          path: test-results/gallery

  secrets:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
