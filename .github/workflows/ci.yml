name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium (PDF renderer)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm parity
      - run: pnpm parity:update
        if: github.event_name == 'pull_request'
        env:
          PARITY_ALLOW_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'no-parity') && '1' || '' }}
      - run: pnpm licences
      - run: pnpm migrations:check
      - run: pnpm migrations:immutable
        if: github.event_name == 'pull_request'
      - run: pnpm audit:lean
      - run: pnpm pr:size
        if: github.event_name == 'pull_request'
        env:
          LEAN_ALLOW_LARGE: ${{ contains(github.event.pull_request.labels.*.name, 'size:large') && '1' || '' }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
