name: pr-meta

# The PR-size and parity guards read the PR description, so they run on description edits too. They live in
# their own workflow: a re-run of ci.yml on a body edit must never replace a red api or browser result.
on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The PR description is untrusted: it only ever reaches a tool through env, never a run script.
      - run: pnpm parity:update
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PARITY_ALLOW_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'no-parity') && '1' || '' }}
      - run: pnpm pr:size
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          LEAN_ALLOW_LARGE: ${{ contains(github.event.pull_request.labels.*.name, 'size:large') && '1' || '' }}
