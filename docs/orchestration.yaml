# Execution routing for the build loop. This is the source of truth the
# orchestrator reads; tools/check-orchestration.ts validates its shape.
# It does not configure DSH itself. The machine-local DSH provider lives in
# ~/.dsh/profiles/desktop/cordis.patch.yml and is documented in
# docs/ORCHESTRATION.md §10.
version: 1

routes:
  planner:
    provider: deepseek-account
    model: deepseek-flash
    writes_product_code: false
  coder:
    provider: openrouter
    model: 'nvidia/nemotron-3-ultra-550b-a55b:free'
    context_window: 1000000
    max_output_tokens: 32768
    writes_product_code: true
  reviewer:
    provider: deepseek-account
    model: deepseek-flash
    writes_product_code: false
  integrator:
    provider: deepseek-account
    model: deepseek-flash
    writes_product_code: false
  probe:
    provider: openrouter
    model: 'cohere/north-mini-code:free'
    writes_product_code: false

execution:
  max_concurrent_coders: 1
  max_coder_attempts: 3
  fresh_context_per_coder: true
  fresh_context_per_reviewer: true
  review_only_after_tests_green: true

limits:
  microtask:
    max_files: 3
    max_new_files: 1
    max_changed_lines: 150
    max_context_tokens: 20000
  ticket:
    max_microtasks: 8
    max_changed_lines: 400

budget:
  currency: USD
  milestone_soft_limit: 20
  milestone_hard_stop: 30
  enforcement: operator
